# Hubvas — Collaborative Canvas Platform
# Production-style single-host deployment.
#
# Only the `web` (nginx) service is exposed publicly (default host port 6161).
# API, WS, and all infrastructure services are internal to the compose network.
#
# Public entry point:  http://<host>:${WEB_HOST_PORT:-6161}
#   /        → React SPA
#   /api/    → api-server (REST)
#   /ws      → ws-server  (WebSocket)
#   /health  → api-server health
#
# Local dev that needs direct access to postgres/redis/etc. should use
# docker-compose.override.yml (auto-loaded when running `docker compose up`
# from this directory, or via `make docker-up`).

services:
  # ---- PostgreSQL 15 — metadata & social data ----
  postgres:
    image: postgres:15-alpine
    container_name: hubvas-postgres
    environment:
      POSTGRES_USER: hubvas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hubvas}
      POSTGRES_DB: hubvas
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run migrations on first start.
      - ../../internal/infrastructure/persistence/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubvas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Redis 7 — presence, locking, rate limiting ----
  redis:
    image: redis:7-alpine
    container_name: hubvas-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- NATS 2 — pub/sub for cross-node fan-out ----
  nats:
    image: nats:2-alpine
    container_name: hubvas-nats
    command: "-js"
    healthcheck:
      test: ["CMD", "nats", "server", "check", "connection"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO — S3-compatible object storage for snapshots ----
  minio:
    image: minio/minio:latest
    container_name: hubvas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Create the snapshot bucket in MinIO on startup.
  minio-init:
    image: minio/mc:latest
    container_name: hubvas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/hubvas-snapshots;
      mc anonymous set private local/hubvas-snapshots;
      echo 'MinIO bucket ready';
      exit 0;
      "

  # ---- API Server (REST) ----
  api-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    container_name: hubvas-api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: hubvas
      DB_PASSWORD: ${DB_PASSWORD:-hubvas}
      DB_NAME: hubvas
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: hubvas-snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---- WebSocket Server (real-time collaboration) ----
  ws-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.ws
    container_name: hubvas-ws
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: hubvas
      DB_PASSWORD: ${DB_PASSWORD:-hubvas}
      DB_NAME: hubvas
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: hubvas-snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---- Web (nginx) — the single public entry point ----
  web:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.web
    container_name: hubvas-web
    ports:
      # Host port configurable via $WEB_HOST_PORT (default 6161).
      - "${WEB_HOST_PORT:-6161}:80"
    depends_on:
      api-server:
        condition: service_healthy
      ws-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
