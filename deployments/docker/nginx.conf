# Hubvas — nginx reverse proxy + SPA host.
#
# Single public entry point:
#   /        → React SPA (static files)
#   /api/    → api-server (REST)
#   /ws      → ws-server  (WebSocket upgrade)
#   /health  → api-server (deploy health check)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Deploy health check → API ----
    location = /health {
        proxy_pass         http://api-server:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass         http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket (real-time collaboration) ----
    location /ws {
        proxy_pass         http://ws-server:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Keep long-lived WS sessions open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Static assets (long cache) ----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback (client-side routing) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
