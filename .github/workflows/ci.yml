name: CI / Deploy

# Build, test, and deploy Hubvas (frontend + backend) to a self-hosted server.
# - Push/PR to any branch  -> lint + test (Go + frontend)
# - Push to main (or manual) -> deploy the full stack, reachable on port 6161
#
# Architecture on the server:
#   nginx (web) :6161  →  public entry point
#     /        → React SPA
#     /api/    → api-server (REST)
#     /ws      → ws-server  (WebSocket)
#     /health  → api-server health
#   Everything else (api/ws/postgres/redis/nats/minio) is internal-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The auto-provided GITHUB_TOKEN only needs to read the repo (for cloning
# onto the server). Explicit is safer than relying on org defaults.
permissions:
  contents: read

# Queue deploys per-ref instead of running them in parallel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  WEB_HOST_PORT: "6161"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Lint, build, and test (runs on every push and PR).
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Build binaries
        run: |
          go build ./cmd/api-server
          go build ./cmd/ws-server

      - name: Run tests (race detector)
        run: go test -race -count=1 ./...

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2 — Deploy to the self-hosted server (only on main).
  #
  # Required GitHub secrets:
  #   DEPLOY_HOST        Server IP or hostname (e.g. 203.0.113.10)
  #   DEPLOY_USER        SSH user with docker access (e.g. deploy)
  #   DEPLOY_SSH_KEY     Private key (contents of ~/.ssh/id_ed25519)
  # Optional secrets:
  #   DEPLOY_PORT        SSH port (default 22)
  #   DEPLOY_PROJECT_DIR Repo path on the server (default ~/go-hubvas)
  #
  # Server prerequisites (one-time):
  #   - Docker + Docker Compose plugin installed
  #   - Repo cloned at DEPLOY_PROJECT_DIR with `origin` pointing to GitHub
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        run: |
          missing=()
          [ -z "${{ secrets.DEPLOY_HOST }}" ]     && missing+=("DEPLOY_HOST")
          [ -z "${{ secrets.DEPLOY_USER }}" ]     && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]  && missing+=("DEPLOY_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_HOST_PORT: ${{ env.WEB_HOST_PORT }}
          PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: "${{ secrets.DEPLOY_PORT || '22' }}"
          envs: WEB_HOST_PORT,PROJECT_DIR,REPO,BRANCH,GITHUB_TOKEN
          command_timeout: 30m   # default is 10s — too short for clone + docker build
          script_stop: true
          script: |
            # NOTE: set -e is intentionally OFF. Every command uses explicit
            # `|| fail "..."` so failures always print a visible reason to
            # stdout (drone-ssh does not reliably stream stderr).
            set -uo pipefail
            export GIT_TERMINAL_PROMPT=0   # never hang on credential prompts

            fail() { echo "❌ ERROR: $*"; exit 1; }
            step() { echo "==> $*"; }

            PROJECT_DIR="${PROJECT_DIR:-$HOME/go-hubvas}"
            COMPOSE_FILE="$PROJECT_DIR/deployments/docker/docker-compose.yaml"
            export WEB_HOST_PORT="${WEB_HOST_PORT:-6161}"
            BRANCH="${BRANCH:-main}"

            step "Project dir  : $PROJECT_DIR"
            step "Web host port: $WEB_HOST_PORT"
            step "Repository   : ${REPO} (branch ${BRANCH})"

            # ---- 1. git ----
            step "Checking git..."
            if command -v git >/dev/null 2>&1; then
              echo "    git present: $(git --version 2>&1)"
            else
              echo "    git MISSING — installing (Debian/Ubuntu)..."
              if [ "$(id -u)" -eq 0 ]; then
                { apt-get update -y && apt-get install -y git; } 2>&1 \
                  || fail "apt-get install git failed"
              else
                { sudo -n apt-get update -y && sudo -n apt-get install -y git; } 2>&1 \
                  || fail "sudo apt-get install git failed — need passwordless sudo (or install git manually)"
              fi
              command -v git >/dev/null 2>&1 \
                || fail "git still unavailable — install manually: sudo apt-get install -y git"
              echo "    git installed: $(git --version 2>&1)"
            fi

            # ---- 2. clone or pull ----
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
              AUTH="GITHUB_TOKEN"
            else
              REMOTE_URL="https://github.com/${REPO}.git"
              AUTH="public HTTPS"
            fi

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              step "Cloning ${REPO} (${BRANCH}) via ${AUTH}..."
              git clone --branch "$BRANCH" "$REMOTE_URL" "$PROJECT_DIR" 2>&1 \
                || fail "git clone failed (see git output above)"
            else
              git -C "$PROJECT_DIR" remote set-url origin "$REMOTE_URL" 2>&1 \
                || fail "git remote set-url failed"
              step "Checkout exists — updating..."
            fi

            cd "$PROJECT_DIR" || fail "cannot cd into $PROJECT_DIR"

            step "Pulling latest code (origin/${BRANCH})"
            git fetch --prune origin "$BRANCH" 2>&1 || fail "git fetch failed"
            git reset --hard "origin/${BRANCH}" 2>&1 || fail "git reset failed"

            # ---- 3. docker ----
            step "Checking docker..."
            command -v docker >/dev/null 2>&1 || fail "docker not installed on server"
            docker compose version 2>&1 || fail "docker compose plugin not installed"

            step "Building images (api, ws, web)"
            # Base compose only — the dev override is intentionally NOT loaded,
            # so infra/db ports stay internal in production.
            docker compose -f "$COMPOSE_FILE" build --pull 2>&1 || fail "docker compose build failed"

            step "(Re)starting services"
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans 2>&1 || fail "docker compose up failed"

            step "Pruning dangling images"
            docker image prune -f 2>&1 || true

            # ---- 4. health ----
            step "Waiting for web health on :${WEB_HOST_PORT} (/health → api-server)"
            healthy=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${WEB_HOST_PORT}/health" >/dev/null 2>&1; then
                echo "    healthy (attempt $i)"
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "❌ Stack did not become healthy within 60s — dumping logs:"
              docker compose -f "$COMPOSE_FILE" logs --tail=100 web api-server ws-server 2>&1 || true
              exit 1
            fi

            step "Deployment successful 🎉"
            docker compose -f "$COMPOSE_FILE" ps 2>&1 || true
