name: CI

# Run checks and publish container images to GHCR.
# Deployment is intentionally managed outside this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push images to GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  # GHCR requires lowercase paths. Owner SevenJL -> sevenjl.
  IMAGE_PREFIX: ghcr.io/sevenjl/go-hubvas

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & test (every push / PR).
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_USER: hubvas
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: hubvas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hubvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: go mod download
      - run: go vet ./...
      - run: |
          go build ./cmd/api-server
          go build ./cmd/ws-server
          go build ./cmd/migrate
      - name: Verify migrations are repeatable
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: hubvas
          DB_PASSWORD: ci-password
          DB_NAME: hubvas
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - run: go test -race -count=1 ./...

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend — unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend — build
        working-directory: frontend
        run: npm run build

      - name: Frontend — install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend — browser tests
        working-directory: frontend
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # 2. Build & push images to GHCR (main only). Three images in parallel.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, dockerfile: deployments/docker/Dockerfile.api }
          - { service: ws,  dockerfile: deployments/docker/Dockerfile.ws  }
          - { service: web, dockerfile: deployments/docker/Dockerfile.web }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
